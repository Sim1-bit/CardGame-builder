<div class="effect-template" id="effect-{{index}}">
    <span class="effect-name">{{index}} - </span><span data-i18n="effects.{{choosenEffect}}.name"></span>
    <br>
    <span data-i18n="effects.{{choosenEffect}}.value"></span> : {{value}}
    <br>
    <span data-i18n="effects.{{choosenEffect}}.target"></span> : {{target}}
    <div id="effect-{{index}}-special"></div>
</div>
