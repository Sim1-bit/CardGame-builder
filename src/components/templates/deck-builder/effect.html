<div class="effect-template" id="effect-{{index}}-{{effectId}}">
    <span class="effect-name">{{effectId}} - </span><span data-i18n="effects.effects.{{choosenEffect}}.name"></span>
    <br>
    <span data-i18n="effects.effects.{{choosenEffect}}.value"></span> : {{value}}
    <br>
    <span data-i18n="effects.effects.{{choosenEffect}}.target"></span> : {{target}}
    <div id="effect-{{index}}-{{effectId}}-special"></div>
</div>
