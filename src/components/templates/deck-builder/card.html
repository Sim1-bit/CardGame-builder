<div class="card-template" id="card-{{index}}">
    <span class="card-name">{{index}} - {{name}}</span>   <input type="checkbox" id="card-{{index}}-checkbox" value="{{id}}"><br><br>
    <span data-i18n="colors.title"></span> : {{color}}<br>
    <span data-i18n="types.title"></span> : {{type}}<br>
    <span data-i18n="grades.title"></span> : {{grade}}<br>

    <div id="effects-list-{{index}}"></div>
</div>
