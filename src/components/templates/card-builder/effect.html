<div class="effect-template" id="effect-{{index}}">
    <input type="hidden" name="effect-type-{{index}}" value="{{choosenEffect}}">
    <span class="effect-name">{{index}} - </span><span data-i18n="effects.effects.{{choosenEffect}}.name"></span>
    <span data-i18n="effects.effects.{{choosenEffect}}.value"></span>
    <input type="number" name="effect-value-{{index}}" value="1" min="{{min}}" max="{{max}}" step="1" except="0">

    <div id="effect-{{index}}-target">
        <span data-i18n="effects.effects.{{choosenEffect}}.target"></span>
        <select name="effect-target-{{index}}">
            <option value="0"><span data-i18n="effects.targets.self"></span></option>
            <option id="effect-target-{{index}}-option2" value="1"><span data-i18n="effects.targets.enemy"></span></option>
        </select>
    </div>

    <div id="effect-{{index}}-{{effectId}}-special"></div>
</div>
