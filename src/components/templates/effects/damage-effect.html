<form class="effect-template" id="effect-{{index}}">
    <input type="hidden" name="effect-type-{{index}}" value="{{choosenEffect}}">
    <span class="effect-name">{{index}} - </span><span data-i18n="effects.damage.name"></span>
    <span data-i18n="effects.damage.value"></span> : 
    <input type="number" name="effect-value-{{index}}" value="1" min="1" max="100" step="1">

    <div id="effect-{{index}}-target">
        <span data-i18n="effects.damage.target"></span> :
        <select name="effect-target-{{index}}">
            <option value="0"><span data-i18n="effects.damage.targets.self"></span></option>
            <option id="effect-target-{{index}}-option2" value="1"><span data-i18n="effects.damage.targets.enemy"></span></option>
        </select>
    </div>
</form>
