<form id="effects-form">
        <span data-i18n="card.effects"></span> : 
        <select id="effects" name="effects">
            <option value="Damage"><span data-i18n="effects.damage.name"></span></option>
            <option value="Draw"><span data-i18n="effects.draw.name"></span></option>
            <option value="Discard"><span data-i18n="effects.discard.name"></span></option>
            <option value="Drop"><span data-i18n="effects.drop.name"></span></option>
            <option value="Heal"><span data-i18n="effects.heal.name"></span></option>
            <option value="Defence"><span data-i18n="effects.defence.name"></span></option>
            <option value="AttBoost"><span data-i18n="effects.AttBoost.name"></span></option>
            <option value="DefBoost"><span data-i18n="effects.DefBoost.name"></span></option>
        </select>
        <br>
        <button data-i18n="card.add-effect" type="button" onclick="addEffectTemplate()"></button>
</form>
